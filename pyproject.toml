[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ongomemory"
version = "0.1.0"
description = "Living memory layer for the Ongo companion robot."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sameer M.", email = "sameer@example.com" }]
keywords = ["memory", "rag", "robotics", "ongo", "vector-search"]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
embed   = ["sentence-transformers>=3.0"]
qdrant  = ["qdrant-client>=1.10"]
dev     = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
all     = ["ongomemory[embed,qdrant,dev]"]

[project.scripts]
ongomemory = "ongomemory.cli:app"

[project.urls]
Homepage = "https://github.com/samson1402/ongo-memory-companion"

# ── tooling ─────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["src/ongomemory"]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/ongomemory"]
